name: e2e-emulator

on:
  # GitHub-hosted Linux runners have no KVM and no working ARM translation for
  # this APK's arm64-only native libs. Keep this manual until a self-hosted
  # runner with hardware acceleration is available; do not schedule a red job.
  workflow_dispatch:

jobs:
  emulator-e2e:
    name: android emulator protocol e2e (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v4

      - name: Checkout host
        uses: actions/checkout@v4
        with:
          repository: AriaLEntropy/Agent-host
          path: host

      - name: Checkout relay
        uses: actions/checkout@v4
        with:
          repository: AriaLEntropy/dsh-scan-remote
          path: relay-repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Install and build host
        working-directory: host
        run: |
          npm ci
          npm run build

      - name: Install and build relay
        working-directory: relay-repo/relay
        run: |
          npm ci
          npm run build

      - name: Build debug APK
        run: bash ./gradlew :androidApp:assembleDebug --no-daemon --console=plain

      - name: Run emulator e2e
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AGENT_HOST_RELAY_DIR: ${{ github.workspace }}/relay-repo/relay
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_5
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash "$GITHUB_WORKSPACE/.github/scripts/emulator-e2e.sh"
