name: e2e-emulator

on:
  # Manual only:
  # - hosted Linux has no KVM and cannot install this arm64-only APK;
  # - hosted macOS is available but this private repo has no paid macOS
  #   minutes, so macos-14 jobs are cancelled before a runner is assigned.
  # Attach a self-hosted runner (Windows with WHPX, or a paid macOS runner)
  # before re-enabling a schedule.
  workflow_dispatch:

jobs:
  emulator-e2e:
    name: android emulator protocol e2e (Windows self-hosted)
    runs-on: [self-hosted, Windows, android]
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ANDROID_HOME: E:\Android
      ANDROID_SDK_ROOT: E:\Android
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v4

      - name: Checkout host
        uses: actions/checkout@v4
        with:
          repository: AriaLEntropy/Agent-host
          path: host

      - name: Checkout relay
        uses: actions/checkout@v4
        with:
          repository: AriaLEntropy/dsh-scan-remote
          path: relay-repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install and build host
        working-directory: host
        run: |
          npm ci
          npm run build

      - name: Install and build relay
        working-directory: relay-repo/relay
        run: |
          npm ci
          npm run build

      - name: Build debug APK
        run: ./gradlew.bat :androidApp:assembleDebug --no-daemon --console=plain

      - name: Run emulator e2e
        shell: bash
        run: bash .github/scripts/emulator-e2e-windows.sh
